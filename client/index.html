<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ember — demo rig</title>
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<header>
  <div class="brand"><span class="dot"></span> EMBER</div>
  <div class="sub">instant play via transient edge execution + recovery-based handoff</div>
  <div class="controls">
    <button id="tap-both" class="primary">Tap both</button>
    <label class="fault"><input type="checkbox" id="break-recovery" /> break recovery</label>
  </div>
</header>

<div id="dash"></div>
<div id="payload-note"></div>

<main>
  <section class="phone" id="baseline">
    <div class="phone-head">
      <h2>Baseline <span class="tag">today</span></h2>
      <div class="timer">0.00s</div>
    </div>
    <div class="stage"></div>
    <div class="status idle">Idle</div>
    <div class="meta"><span class="claim"></span><span class="transport"></span><span class="local"></span></div>
    <button class="tap">Tap to play</button>
  </section>

  <section class="phone" id="ember">
    <div class="phone-head">
      <h2>Ember <span class="tag good">proposed</span></h2>
      <div class="timer">0.00s</div>
    </div>
    <div class="stage"></div>
    <div class="status idle">Idle</div>
    <div class="meta"><span class="claim"></span><span class="transport"></span><span class="local"></span></div>
    <button class="tap">Tap to play</button>
  </section>
</main>

<script src="./app.js"></script>
</body>
</html>
